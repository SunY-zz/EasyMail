# 使用新的email.listener配置格式
email:
  # 邮件监听配置
  listener:
    enabled: true
    server:
      host: imap.qq.com
      port: 993
      protocol: imaps
      username: 3379652824@qq.com
      password: tkfrljmhkckhdbdi
      folder: INBOX
    connection:
      timeout: 15000
      read-timeout: 30000
      write-timeout: 30000
      trust-all-certs: true
    monitor:
      idle-timeout: 20000
      keep-alive-interval: 240
      reconnect-delay: 15
      short-delay: 5
      long-delay: 30
      task-timeout: 300
    listener:
      max-retries: 20
      auto-start: true
      process-existing-unread: true
      core-pool-size: 16
      max-pool-size: 50
      queue-capacity: 100
    log:
      debug-enabled: false
    attachment:
      save-dir: D:\
      save-attachments: true
      use-unique-filename: true

# 注解驱动邮件处理器配置
annotation-driven-email-processor:
  enabled: true
  scan:
    packages:
      - cn.sunyblog.javaemaildemo.example
      - cn.sunyblog.javaemaildemo.processor

# 日志配置
logging:
  level:
    cn.sunyblog.easymail.processor: DEBUG
    cn.sunyblog.easymail.mail: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %pid --- [%15.15t] %-40.40logger{39} : %m%n"

# Spring Boot配置
spring:
  # 应用配置
  application:
    name: JavaEmailDemo

  # 开发工具配置
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8088