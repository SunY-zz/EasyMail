server:
  port: 8088

# 邮件配置
mail:
  imap:
    server: imap.qq.com
    port: 993
    protocol: imaps
    username: @qq.com # 邮箱
    password:   # QQ邮箱的授权码
    attachment-dir: D:\ # 附件保存目录
    # 连接配置
    connection:
      timeout: 15000 # 连接超时(毫秒)
      read-timeout: 30000 # 读取超时(毫秒)
      write-timeout: 30000 # 写入超时(毫秒)
    # 监控配置
    monitor:
      idle-timeout: 20000 # IDLE命令超时时间(毫秒)，增加到20秒
      keep-alive-interval: 240 # 保活间隔(秒)，减少到4分钟
      reconnect-delay: 15 # 重连延迟(秒)
      short-delay: 5 # 短暂延迟(秒)
      long-delay: 30 # 长延迟(秒)
      task-timeout: 300
    listener:
      max-retries: 20
    # 日志配置
    log:
      debug-enabled: false # 是否启用调试日志

  # SMTP邮件发送配置
  smtp:
    server: smtp.163.com # SMTP服务器地址
    port: 465 # SMTP服务器SSL端口
    protocol: smtp # 协议
    username: @163.com # 邮箱
    password:     # QQ邮箱的授权码
    connection:
      timeout: 15000 # 连接超时(毫秒)
      read-timeout: 30000 # 读取超时(毫秒)
      write-timeout: 30000 # 写入超时(毫秒)
    properties:
      mail-smtp-auth: true # 启用SMTP认证
      mail-smtp-starttls-enable: false # 启用STARTTLS
    retry:
      enabled: true # 是否启用重试机制
      max-retries: 3 # 最大重试次数
      initial-delay-ms: 1000 # 初始重试延迟(毫秒)
      max-delay-ms: 10000 # 最大重试延迟(毫秒)
      use-exponential-backoff: true # 是否使用指数退避策略
      backoff-multiplier: 2.0 # 退避乘数
    log:
      debug-enabled: false # 是否启用调试日志

# 注解驱动邮件处理器配置
annotation-driven-email-processor:
  enabled: true
  scan:
    packages:
      - cn.sunyblog.javaemaildemo.example
      - cn.sunyblog.javaemaildemo.processor

# 日志配置
logging:
  level:
    cn.sunyblog.easymail.processor: INFO
    cn.sunyblog.easymail.mail: INFO
    cn.sunyblog.easymail: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %pid --- [%15.15t] %-40.40logger{39} : %m%n"

# Spring Boot配置
spring:
  profiles:
    active: email-processor

  # 应用配置
  application:
    name: JavaEmailDemo

  # 开发工具配置
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
